<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free design review — BoundlessCAD</title>
<meta name="description" content="Send one of your own exocad designs and get a free second-opinion check of margins, contacts, occlusion, minimum thickness and connectors within 48 hours.">
<link rel="canonical" href="https://boundlesscaddesign-dev.github.io/review/">
<meta property="og:title" content="Free exocad design review for dental labs">
<meta property="og:description" content="A second pair of eyes on your design: margins, contacts, occlusion, thickness — free, within 48 h.">
<meta property="og:image" content="https://boundlesscaddesign-dev.github.io/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b1826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../cases/shared.css">
<style>
header{position:sticky;top:0;z-index:20;background:rgba(11,24,38,.85);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:0 22px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar nav{display:flex;gap:8px;align-items:center}
.lg{font:inherit;font-size:13px;font-weight:800;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 11px;cursor:pointer}
.lg.on,.lg:hover{color:#fff;border-color:var(--teal)}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
.hero{padding:60px 0 20px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-1.5px;margin:14px 0 14px;max-width:780px}
.lead{color:var(--muted);font-size:17px;max-width:640px}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:36px 0}
.ck{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.ck .i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(127,209,199,.12);color:var(--teal);font-size:20px;font-weight:800}
.ck h3{font-size:16px;margin:12px 0 6px}.ck p{font-size:14px;color:var(--muted)}
.steps{display:grid;gap:12px;margin:10px 0 36px;counter-reset:s}
.st{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.st::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:10px;background:var(--teal);color:#06241f;display:grid;place-items:center;font-weight:800}
.st h4{font-size:16px;margin-bottom:4px}.st p{font-size:14.5px;color:#c9d6df}
h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.6px;margin:10px 0 14px}
.fine{color:var(--muted);font-size:13.5px;margin:0 0 60px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
@media (max-width:820px){.checks{grid-template-columns:1fr 1fr}.bar nav .ghost{display:none}}
@media (max-width:480px){.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="../" aria-label="BoundlessCAD home"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="#7FD1C7" stroke-width="4" stroke-linecap="round" stroke-dasharray="118 52"/><path d="M24 22c-3 0-5 3-5 6 0 5 2 7 3 11 1 4 2 7 3.5 7s2.5-3 3.2-6.5c.6-1.8 1.4-2.5 3.3-2.5s2.7.7 3.3 2.5c.7 3.5 1.7 6.5 3.2 6.5S43 43 44 39c1-4 3-6 3-11 0-3-2-6-5-6-2.5 0-4 1.6-9 1.6S26.5 22 24 22z" fill="#fff"/></svg><span>Boundless<b>CAD</b></span></a>
  <nav><a class="btn ghost" href="../plans/" data-i="npl">Plans</a><button class="lg" data-l="en">EN</button><button class="lg" data-l="es">ES</button><button class="lg" data-l="de">DE</button></nav>
</div></header>
<section class="hero"><div class="wrap">
  <div class="eyebrow" data-i="eb">Free design review</div>
  <h1 data-i="h1"></h1>
  <p class="lead" data-i="lead"></p>
  <div class="ctas"><a class="btn" id="mail" href="#" data-i="c1">Send a design for review →</a><a class="btn ghost" href="../cases/" data-i="c2">See our designs in 3D</a></div>
</div></section>
<main class="wrap">
  <div class="checks" id="checks"></div>
  <h2 data-i="hh">How it works</h2>
  <div class="steps" id="steps"></div>
  <p class="fine" data-i="fine"></p>
</main>
<footer><div class="wrap">© 2026 BoundlessCAD · boundlesscad.design@gmail.com</div></footer>
<script>
const T={
en:{npl:"Plans",eb:"Free design review",h1:'A second pair of eyes <span class="serif">on your design.</span>',lead:"Send one design your team made in exocad. Within 48 hours we send back a short, practical review — what's good, what we'd change, and why. Free, no strings attached.",
c1:"Send a design for review →",c2:"See our designs in 3D",
checks:[["◠","Margins","Continuity, over- or under-extension, emergence at the margin."],["⇆","Proximal contacts","Strength and position against neighbours."],["⌒","Occlusion","Static contacts, interferences, cusp heights."],["▭","Minimum thickness","Against the material you plan to use."],["⊟","Connectors","Cross-section for bridges and the chosen material."],["⌖","Implant emergence","Profile, screw channel and abutment shape."]],
hh:"How it works",steps:[["Export your design","An exocad webview (HTML), the STL files, or the exocad project — plus the material."],["Email it to us","Subject \"Design review\" to boundlesscad.design@gmail.com, or share a download link. Use a case code, never the patient's name."],["Get your review in 48 h","A short written report with annotated screenshots and concrete suggestions."]],
fine:"One free review per lab. We review, we don't redesign — if you'd like us to design the case, your first case is free too.",subj:"Design review",body:l=>`Hi BoundlessCAD,\n\nplease review the attached design.\n\nLab: ${l||''}\nMaterial: \nCase code: \n\nThanks!`,title:"Free design review — BoundlessCAD"},
es:{npl:"Planes",eb:"Revisión de diseño gratis",h1:'Una segunda mirada <span class="serif">a su diseño.</span>',lead:"Envíe un diseño hecho por su equipo en exocad. En 48 horas le devolvemos una revisión breve y práctica: qué está bien, qué cambiaríamos y por qué. Gratis y sin compromiso.",
c1:"Enviar un diseño para revisión →",c2:"Ver nuestros diseños en 3D",
checks:[["◠","Márgenes","Continuidad, sobre- o subextensión, emergencia en el margen."],["⇆","Contactos proximales","Intensidad y posición con los vecinos."],["⌒","Oclusión","Contactos estáticos, interferencias, altura de cúspides."],["▭","Espesor mínimo","Según el material que va a usar."],["⊟","Conectores","Sección transversal en puentes según el material."],["⌖","Emergencia en implantes","Perfil, chimenea y forma del pilar."]],
hh:"Cómo funciona",steps:[["Exporte su diseño","Un webview de exocad (HTML), los STL o el proyecto exocad, más el material."],["Envíenoslo por correo","Asunto \"Revisión de diseño\" a boundlesscad.design@gmail.com, o comparta un enlace. Use un código de caso, nunca el nombre del paciente."],["Reciba la revisión en 48 h","Un informe breve con capturas anotadas y sugerencias concretas."]],
fine:"Una revisión gratis por laboratorio. Revisamos, no rediseñamos; si quiere que diseñemos el caso, su primer caso también es gratis.",subj:"Revisión de diseño",body:l=>`Hola BoundlessCAD:\n\npor favor revisen el diseño adjunto.\n\nLaboratorio: ${l||''}\nMaterial: \nCódigo de caso: \n\n¡Gracias!`,title:"Revisión de diseño gratis — BoundlessCAD"},
de:{npl:"Pakete",eb:"Kostenloser Design-Check",h1:'Ein zweiter Blick <span class="serif">auf Ihre Konstruktion.</span>',lead:"Senden Sie eine Konstruktion Ihres Teams aus exocad. Innerhalb von 48 Stunden erhalten Sie eine kurze, praxisnahe Rückmeldung – was gut ist, was wir ändern würden und warum. Kostenlos und unverbindlich.",
c1:"Konstruktion zur Prüfung senden →",c2:"Unsere Konstruktionen in 3D",
checks:[["◠","Präparationsgrenze","Verlauf, Über- oder Unterextension, Emergenz am Rand."],["⇆","Approximalkontakte","Stärke und Lage zu den Nachbarzähnen."],["⌒","Okklusion","Statische Kontakte, Störkontakte, Höckerhöhen."],["▭","Mindestwandstärke","Passend zum geplanten Material."],["⊟","Verbinder","Querschnitt bei Brücken je nach Material."],["⌖","Implantat-Emergenz","Profil, Schraubenkanal und Abutmentform."]],
hh:"So funktioniert's",steps:[["Konstruktion exportieren","Ein exocad-Webview (HTML), die STL-Dateien oder das exocad-Projekt – plus Material."],["Per E-Mail senden","Betreff \"Design-Check\" an boundlesscad.design@gmail.com oder Download-Link teilen. Fallcode statt Patientenname."],["Rückmeldung in 48 h","Ein kurzer Bericht mit kommentierten Screenshots und konkreten Vorschlägen."]],
fine:"Ein kostenloser Check pro Labor. Wir prüfen, wir konstruieren nicht neu – wenn wir den Fall konstruieren sollen, ist Ihr erster Fall ebenfalls kostenlos.",subj:"Design-Check",body:l=>`Hallo BoundlessCAD,\n\nbitte prüfen Sie die angehängte Konstruktion.\n\nLabor: ${l||''}\nMaterial: \nFallcode: \n\nDanke!`,title:"Kostenloser Design-Check — BoundlessCAD"}};
const q=new URLSearchParams(location.search);const lab=(q.get('lab')||'').replace(/[<>"'`]/g,'').slice(0,60),ref=(q.get('ref')||'').replace(/[<>"'`]/g,'').slice(0,60);
let lang=(q.get('lang')||navigator.language||'en').slice(0,2);if(!T[lang])lang='en';
function apply(){const t=T[lang];document.documentElement.lang=lang;document.title=t.title;
 document.querySelectorAll('[data-i]').forEach(el=>{const v=t[el.dataset.i];if(typeof v==='string')el.innerHTML=v});
 document.getElementById('checks').innerHTML=t.checks.map(c=>`<div class="ck"><div class="i">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('');
 document.getElementById('steps').innerHTML=t.steps.map(s=>`<div class="st"><div><h4>${s[0]}</h4><p>${s[1]}</p></div></div>`).join('');
 document.getElementById('mail').href=`mailto:boundlesscad.design@gmail.com?subject=${encodeURIComponent(t.subj+(lab?' — '+lab:'')+(ref?' (ref: '+ref+')':''))}&body=${encodeURIComponent(t.body(lab))}`;
 document.querySelectorAll('.lg').forEach(b=>b.classList.toggle('on',b.dataset.l===lang))}
document.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{lang=b.dataset.l;const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState(null,'',u);apply()});
apply();
</script>
</body>
</html>
